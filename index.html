<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071425" />
  <link rel="manifest" href="./manifest.json" />
  <title>SIM Tool</title>
  <style>
    :root {
      --bg: #071425;
      --bg2: #0b1d2d;
      --muted: #9aa4b2;
      --accent: #327acd;
      --text: #e6eef6;
      --panel: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    body { overflow: hidden; }
    button, input { font: inherit; }
    .phone {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    #screen {
      flex: 1;
      overflow: hidden;
      position: relative;
      background: var(--bg);
    }
    .page {
      width: 100%;
      height: 100%;
      display: none;
      background: var(--bg);
    }
    .page.active { display: block; }
    .hidden { display: none !important; }

    #mainIcons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 24px 18px 18px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .icon {
      border: 0;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 18px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 22px;
    }
    .icon .label {
      font-size: 12px;
      color: var(--muted);
    }

    .navbar {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 64px;
      padding: 0 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--line);
    }
    .back {
      background: transparent;
      border: 0;
      color: #fff;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      width: 36px;
    }
    .nav-title {
      font-weight: 700;
      font-size: 20px;
    }

    .list, .stack {
      padding: 16px;
    }
    .list-item {
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 16px 14px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text);
    }
    .row {
      display: flex;
      gap: 10px;
      padding: 16px;
    }
    .input {
      flex: 1;
      border: 1px solid #38506a;
      background: rgba(5, 12, 18, 0.6);
      color: #fff;
      border-radius: 9px;
      padding: 12px 14px;
      outline: none;
    }
    .btn {
      border: 0;
      background: var(--accent);
      color: #fff;
      border-radius: 9px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      min-width: 90px;
    }
    .small {
      padding: 18px 16px 6px;
      color: var(--muted);
      font-size: 15px;
    }
    .landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 18px;
    }
    .landing h1 { margin: 0 0 8px; font-size: 32px; }
    .landing p { margin: 0; color: var(--muted); }
    .confirm {
      margin: 18px 16px;
      padding: 18px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      color: var(--text);
      line-height: 1.5;
    }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 32px 16px;
    }
    .muted { color: var(--muted); }
    .profile-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #f0c74d;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-avatar svg {
      width: 22px;
      height: 22px;
      stroke: #fff;
      stroke-width: 2;
      fill: none;
    }
    #chatWindow {
      height: calc(100% - 64px - 56px);
      overflow-y: auto;
      padding: 16px 20px 28px;
      background: #101a1a;
    }
    .dont-reply-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255,255,255,0.04);
      border-top: 1px solid var(--line);
      padding: 14px 18px;
      color: #c9d1d6;
      font-size: 14px;
    }
    .dont-reply-footer a {
      color: #7dc3ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div id="mainIcons">
      <button id="senderIcon" class="icon" type="button"><span>➤</span><span class="label">Send</span></button>
      <button id="receiverIcon" class="icon" type="button"><span>▢</span><span class="label">Messages</span></button>
      <button id="resetIcon" class="icon" type="button"><span>↻</span><span class="label">Reset</span></button>
    </div>

    <main id="screen">
      <section id="landing" class="page active">
        <h1>SIM Tool</h1>
        <p>Offline M-PESA simulator</p>
      </section>

      <section id="senderHome" class="page">
        <div class="navbar">
          <button class="back" type="button" data-back="landing">‹</button>
          <div class="nav-title">M-PESA</div>
        </div>
        <div class="list">
          <div id="openSend" class="list-item"><span>Send Money</span><span>›</span></div>
        </div>
      </section>

      <section id="sendPhone" class="page">
        <div class="navbar">
          <button class="back" type="button" data-back="senderHome">‹</button>
          <div class="nav-title">Send Money</div>
        </div>
        <div class="small">Enter phone number</div>
        <div class="row">
          <input id="phone" class="input" type="text" inputmode="numeric" maxlength="12" placeholder="2547..." />
          <button id="phoneNext" class="btn" type="button">Next</button>
        </div>
      </section>

      <section id="sendAmount" class="page">
        <div class="navbar">
          <button class="back" type="button" data-back="sendPhone">‹</button>
          <div class="nav-title">Enter Amount</div>
        </div>
        <div class="row">
          <input id="amount" class="input" type="number" min="0.01" step="0.01" placeholder="Enter amount" />
          <button id="amountNext" class="btn" type="button">Next</button>
        </div>
      </section>

      <section id="sendPin" class="page">
        <div class="navbar">
          <button class="back" type="button" data-back="sendAmount">‹</button>
          <div class="nav-title">Enter PIN</div>
        </div>
        <div class="row">
          <input id="pin" class="input" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" />
          <button id="pinNext" class="btn" type="button">Next</button>
        </div>
      </section>

      <section id="sendName" class="page">
        <div class="navbar">
          <button class="back" type="button" data-back="sendPin">‹</button>
          <div class="nav-title">Recipient</div>
        </div>
        <div class="row">
          <input id="name" class="input" type="text" maxlength="60" placeholder="Recipient name" />
          <button id="doSend" class="btn" type="button">Send</button>
        </div>
      </section>

      <section id="confirm" class="page">
        <div class="navbar">
          <button class="back" type="button" data-back="landing">‹</button>
          <div class="nav-title">Sent</div>
        </div>
        <div id="confirmText" class="confirm">Your M-PESA message was sent successfully.</div>
      </section>

      <section id="inbox" class="page">
        <div class="navbar">
          <button class="back" type="button" data-back="landing">‹</button>
          <div class="nav-title">Messages</div>
        </div>
        <div id="inboxList" class="list"></div>
      </section>

      <section id="conversationBaby" class="page">
        <div class="navbar">
          <button class="back" type="button" data-back="inbox">‹</button>
          <div class="profile-avatar">
            <svg viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="nav-title">MPESA</div>
        </div>
        <div id="chatWindow"></div>
        <div class="dont-reply-footer">Can't reply to this short code. <a href="#">Learn more</a></div>
      </section>
    </main>
  </div>

  <script src="./mpesa-card.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      'use strict';

      var KEY = 'simtool-production-v1';
      var DAILY_LIMIT = 500000;
      var state = { balance: 3000, daily: DAILY_LIMIT, messages: [], date: '' };
      var flow = {};
      var pages = Array.prototype.slice.call(document.querySelectorAll('.page'));

      function todayKey() {
        return new Date().toISOString().slice(0, 10);
      }

      function saveState() {
        try {
          localStorage.setItem(KEY, JSON.stringify(state));
        } catch (_) {}
      }

      function loadState() {
        try {
          var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
          if (saved) state = Object.assign(state, saved);
        } catch (_) {}

        if (!state.date || state.date !== todayKey()) {
          state.date = todayKey();
          state.daily = DAILY_LIMIT;
          saveState();
        }
      }

      function show(id) {
        pages.forEach(function (page) {
          page.classList.toggle('active', page.id === id);
        });
        var landingVisible = id === 'landing';
        document.getElementById('mainIcons').style.display = landingVisible ? 'grid' : 'none';
        if (id === 'conversationBaby') {
          document.getElementById('chatWindow').scrollTop = document.getElementById('chatWindow').scrollHeight;
        }
      }

      function resetFlow() {
        flow = {};
        ['phone','amount','pin','name'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.value = '';
        });
      }

      function validPhone(value) {
        return /^\d{9,12}$/.test(String(value).trim());
      }

      function renderInbox() {
        var inbox = document.getElementById('inboxList');
        inbox.innerHTML = '';

        if (!state.messages.length) {
          inbox.innerHTML = '<div class="empty">No messages yet.</div>';
          return;
        }

        var item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = '<span><strong>M-PESA</strong><br><span class="muted">' + state.messages.length + ' message' + (state.messages.length === 1 ? '' : 's') + '</span></span><span>›</span>';
        item.addEventListener('click', function () {
          openConversation();
        });
        inbox.appendChild(item);
      }

      function openConversation() {
        var chat = document.getElementById('chatWindow');
        chat.innerHTML = '';

        state.messages.forEach(function (entry) {
          var node = document.createElement('div');
          if (window.renderMpesaCard) {
            window.renderMpesaCard(node, entry);
          } else {
            node.textContent = entry.text || '';
          }
          chat.appendChild(node);
        });

        show('conversationBaby');
        setTimeout(function () {
          chat.scrollTop = chat.scrollHeight;
        }, 0);
      }

      document.getElementById('senderIcon').addEventListener('click', function () {
        resetFlow();
        show('senderHome');
      });

      document.getElementById('receiverIcon').addEventListener('click', function () {
        renderInbox();
        show('inbox');
      });

      document.getElementById('resetIcon').addEventListener('click', function () {
        if (!window.confirm('Clear all saved messages and reset the balance?')) return;
        state = { balance: 3000, daily: DAILY_LIMIT, messages: [], date: todayKey() };
        saveState();
        resetFlow();
        show('landing');
      });

      document.getElementById('openSend').addEventListener('click', function () {
        show('sendPhone');
      });

      document.getElementById('phoneNext').addEventListener('click', function () {
        var value = document.getElementById('phone').value.trim();
        if (!validPhone(value)) {
          window.alert('Enter a valid 9-12 digit phone number.');
          return;
        }
        flow.phone = value;
        show('sendAmount');
      });

      document.getElementById('amountNext').addEventListener('click', function () {
        var value = Number(document.getElementById('amount').value);
        if (!Number.isFinite(value) || value <= 0) {
          window.alert('Enter a valid amount.');
          return;
        }
        if (value > state.daily) {
          window.alert('Amount exceeds the daily transaction limit.');
          return;
        }
        flow.amount = Math.round(value * 100) / 100;
        show('sendPin');
      });

      document.getElementById('pinNext').addEventListener('click', function () {
        var value = document.getElementById('pin').value.trim();
        if (!/^\d{4}$/.test(value)) {
          window.alert('PIN must be exactly 4 digits.');
          return;
        }
        show('sendName');
      });

      document.getElementById('doSend').addEventListener('click', function () {
        var name = document.getElementById('name').value.trim();
        if (!name) {
          window.alert('Enter the recipient name.');
          return;
        }

        var now = new Date();
        var fee = 10;
        var newBalance = Math.round((state.balance - flow.amount - fee) * 100) / 100;
        if (newBalance < 0) {
          window.alert('Insufficient balance.');
          return;
        }

        state.balance = newBalance;
        state.daily = Math.round((state.daily - flow.amount) * 100) / 100;

        var text = 'Confirmed. Ksh' + Number(flow.amount).toFixed(2) + ' sent to ' + name + ' ' + flow.phone + ' on ' + now.toLocaleDateString('en-GB') + ' at ' + now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '. New M-PESA balance is Ksh' + state.balance.toFixed(2) + '. Transaction cost, Ksh' + fee.toFixed(2) + '. Amount you can transact within the day is ' + state.daily.toFixed(2) + '. See all your balances now https://saf.cx/kWQpy';

        var entry = {
          text: text,
          ts: now.getTime(),
          name: name,
          phone: flow.phone,
          amount: Number(flow.amount).toFixed(2),
          balance: state.balance.toFixed(2)
        };

        state.messages.push(entry);
        saveState();
        resetFlow();
        document.getElementById('confirmText').textContent = 'Your M-PESA message was sent successfully.';
        show('confirm');
      });

      Array.prototype.forEach.call(document.querySelectorAll('[data-back]'), function (btn) {
        btn.addEventListener('click', function () {
          var target = btn.getAttribute('data-back');
          if (target) show(target);
        });
      });

      loadState();
      renderInbox();
      show('landing');

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js').catch(function () {});
      }
    });
  </script>
</body>
</html>
